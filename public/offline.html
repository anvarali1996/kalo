<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#285a43" />
  <link rel="icon" type="image/png" href="/icons/kalo-balance-192.png" />
  <title>Kalo Balance — Internet yo‘q</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #285a43;
      background: #f6f8f3;
    }

    main {
      max-width: 410px;
      padding: clamp(22px, 6vw, 36px);
      border: 1px solid #e5ece4;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 12px 35px #285a4311;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
    }

    h1 { font-size: 24px; margin: 24px 0 12px; }
    p { font-size: 15px; color: #5d7567; line-height: 1.6; }

    button {
      appearance: none;
      cursor: pointer;
      margin-top: 16px;
      padding: 14px 22px;
      border: none;
      border-radius: 12px;
      background: #285a43;
      color: white;
      font-size: 15px;
      font-weight: 700;
    }
  </style>
</head>
<body>
<main>
  <div class="brand"><img src="/icons/kalo-balance-192.png" width="42" height="42" alt="" />Kalo Balance</div>
  <h1 id="offline-heading">Internetga ulanib qayta urinib ko‘ring</h1>
  <p id="offline-description">Ovqat kundaligi va skaner uchun internet kerak. Bu sahifa shaxsiy ma’lumotlaringizni keshga saqlamaydi.</p>
  <p id="offline-english" lang="en">You're offline. Reconnect to use your diary and the food scanner.</p>
  <button id="offline-retry" type="button" onclick="location.reload()">Qayta urinish / Retry</button>
</main>
<script>
  // Use the language saved by the app without loading an external script.
  const offlineCopy = {
    en: {
      title: "Kalo Balance — Offline",
      heading: "Reconnect and try again",
      description: "The food diary and scanner need an internet connection. This page does not cache your personal data.",
      retry: "Retry",
    },
    ru: {
      title: "Kalo Balance — Нет интернета",
      heading: "Подключитесь к интернету и повторите попытку",
      description: "Для дневника питания и сканера нужен интернет. Эта страница не сохраняет ваши личные данные в кеше.",
      retry: "Повторить",
    },
    lv: {
      title: "Kalo Balance — Nav interneta",
      heading: "Pieslēdzies internetam un mēģini vēlreiz",
      description: "Uztura dienasgrāmatai un skenerim vajadzīgs internets. Šī lapa nesaglabā tavus personas datus kešatmiņā.",
      retry: "Mēģināt vēlreiz",
    },
  };

  let language;
  try { language = localStorage.getItem("kalo_locale"); }
  catch { /* Keep the default text if storage is unavailable. */ }
  if (Object.hasOwn(offlineCopy, language)) {
    const copy = offlineCopy[language];
    document.documentElement.lang = language;
    document.title = copy.title;
    document.getElementById("offline-heading").textContent = copy.heading;
    document.getElementById("offline-description").textContent = copy.description;
    document.getElementById("offline-retry").textContent = copy.retry;
    document.getElementById("offline-english").hidden = true;
  }
</script>
</body>
</html>
